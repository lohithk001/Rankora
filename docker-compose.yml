version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rankora-postgres
    restart: always
    environment:
      POSTGRES_USER: rankora
      POSTGRES_PASSWORD: rankorapassword
      POSTGRES_DB: rankora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: rankora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rankora-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://rankora:rankorapassword@postgres:5432/rankora_db?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-rankora-key
      NODE_ENV: development
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rankora-client
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
